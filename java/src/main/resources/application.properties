spring.application.name=ranking

# Conexion a PostgreSQL (contenedor de docker-compose.yml)
spring.datasource.url=jdbc:postgresql://localhost:55432/ranking
spring.datasource.username=ranking
spring.datasource.password=ranking

# Ejecuta schema.sql al iniciar (crea la tabla si no existe)
spring.sql.init.mode=always

# Puerto de la API
server.port=8080

# Sirve el frontend desde la carpeta web/ del repositorio
spring.web.resources.static-locations=file:../web/


# Carpeta de los PDF del corpus (relativa a java/)
ranking.carpeta-pdfs=../data/pdfs

# Carpeta de los abstracts en JSON (correcciones manuales)
ranking.carpeta-abstracts=../data/abstracts

# Titulo y autores de cada articulo (verificados a mano contra el PDF)
ranking.archivo-metadatos=../data/metadatos.json


# Carpeta donde se guardan tiempos.csv, top15.csv y equipo.txt
ranking.carpeta-resultados=../results/java

# Ejecutar la medicion de tiempos al iniciar (tarda unos segundos)
ranking.medicion.ejecutar=false


# Oculta los avisos de fuentes de PDFBox (no afectan la extraccion)
logging.level.org.apache.pdfbox=ERROR


# Incluye el mensaje de error en las respuestas 400 de la API
server.error.include-message=always